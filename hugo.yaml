baseURL: https://www.wiztools.org/
title: WizTools.org
locale: en-US
enableRobotsTXT: true
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
menu:
  main:
    - name: Products
      pageRef: /products
      weight: 1
    - name: Books
      pageRef: /books
      weight: 2
    - name: About
      pageRef: /subwiz
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      url: https://github.com/wiztools
      weight: 5
      params:
        icon: github
params:
  description: Open-source tools and libraries for programmer productivity, by Subhash Chandran.
  theme:
    default: dark
    displayToggle: true
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/wiztools-logo-light.svg
      dark: images/wiztools-logo.svg
      width: 170
      height: 44
  footer:
    displayCopyright: true
    displayPoweredBy: false
  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: js/vendor/flexsearch.bundle.min.js
  page:
    width: normal
